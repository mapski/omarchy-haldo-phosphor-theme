name: Validate theme
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version, palette, assets and documentation
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import re
          import struct
          import tomllib

          root = Path('.')
          version = (root / 'VERSION').read_text().strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Invalid VERSION'
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              assert os.environ.get('GITHUB_REF_NAME') == 'v' + version, 'Tag/VERSION mismatch'
          assert f'v{version}' in (root / 'README.md').read_text()
          assert f'## {version} ' in (root / 'CHANGELOG.md').read_text()

          # Approved appearance; change these digests only with an intentional visual update.
          protected_files = {
              'colors.toml': '2e68e10f1c618fb920686efbf5b851b13ec9c15cc3cfffbf07c7ffa2d6fd34d5',
              'icons.theme': 'b14b7a19287d12877cb46cc70a715fd25aae7ba475d3d1120392e7adadd23649',
              'shell.bar.toml': '7692c4de0984ed0d0624f6ccfbb15f0999ab195f609a145b07144e4b9b4f5cc9',
              'shell.font.toml': '47aed15a59e55df185af61dfee5caf9f0d26a37eb8bea82d77373a2ecbb4f767',
              'shell.controls.toml': 'bbb631868654faf34c9048596d2f3a6ae6f70018b7a3c848f18fa31f2e390734',
              'shell.menu.toml': '964a2c87abf0ed1723a094a9ba024cf5e1b21907408bc47416a9b0f5d4a9f0bf',
              'shell.launcher.toml': '964a2c87abf0ed1723a094a9ba024cf5e1b21907408bc47416a9b0f5d4a9f0bf',
              'shell.popups.toml': '6cf26c284039f6c57a30ccfe9992a2ffa26ea8324129469a4ef4919478d2a606',
              'shell.tooltip.toml': '8db51611956407bd4f39cb7b34d16fbc46ed25c61aa167c5cd0ae4f280649286',
              'shell.notifications.toml': 'b1c618a43d411b6d0b1f75d8fa122ebd427350dc331a25e3c158579527f2a84f',
              'shell.lock.toml': '269290c06f29cdf6747d1ba0b98fe96be75d6f22c8de8cbca6ece1a14921b8b9',
              'backgrounds/01-jade-prism.png': '309065f57813f0524811be5f419c6d3f93486c16cb4e69fb25dfbc2e01eb096d',
              'backgrounds/02-ember-coast.png': '5e7f67be09d9414da9bec0ea36dde1049aca6a2aecfa06c86e67569d67560b18',
              'backgrounds/03-phosphor-bloom.png': '6b39c17615587c270371b5f5c0bf63b1256b0fcd3fbd9176cf460c5a02e7a54f',
              'screenshots/01-jade-prism.png': '102c889e21886fe63e68d0f44431d9064fb5dc774ddbe3eabec57de337f15aae',
              'screenshots/02-ember-coast.png': '525648952f16038388adf427e35c65e31805dc3c2663bc3652a192a400c0a3f8',
              'screenshots/03-phosphor-bloom.png': 'd396cbb522427f6172c6990c56574f8c9ae3416aa5b8456aa74d51dd02962ce9',
              'preview.png': '102c889e21886fe63e68d0f44431d9064fb5dc774ddbe3eabec57de337f15aae',
          }
          for name, digest in protected_files.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, f'Protected appearance changed: {name}'

          palette = tomllib.loads((root / 'colors.toml').read_text())
          for key, value in palette.items():
              if key != 'mode':
                  assert re.fullmatch(r'#[0-9a-fA-F]{6}', value), key
          def luminance(value):
              rgb = [int(value[i:i+2], 16) / 255 for i in (1, 3, 5)]
              linear = [c / 12.92 if c <= .04045 else ((c + .055) / 1.055) ** 2.4 for c in rgb]
              return sum(c * w for c, w in zip(linear, (.2126, .7152, .0722)))
          roles = ['foreground', 'dark_foreground', 'accent', 'muted', 'red', 'yellow',
                   'orange', 'green', 'cyan', 'blue', 'magenta', 'bright_foreground']
          for role in roles:
              for surface in ['background', 'lighter_background', 'selection']:
                  low, high = sorted([luminance(palette[role]), luminance(palette[surface])])
                  assert (high + .05) / (low + .05) >= 4.5, f'Low contrast: {role}/{surface}'
          expected_sections = {'bar', 'controls', 'font', 'launcher', 'lock', 'menu',
                               'notifications', 'popups', 'tooltip'}
          sections = list(root.glob('shell.*.toml'))
          assert {p.name.split('.')[1] for p in sections} == expected_sections
          for path in sections:
              tomllib.loads(path.read_text())

          expected_backgrounds = {'01-jade-prism.png', '02-ember-coast.png', '03-phosphor-bloom.png'}
          assert {p.name for p in (root / 'backgrounds').iterdir()} == expected_backgrounds
          assert {p.name for p in (root / 'screenshots').iterdir()} == expected_backgrounds
          images = [(p, (3840, 2160)) for p in (root / 'backgrounds').iterdir()]
          images += [(p, (2560, 1440)) for p in (root / 'screenshots').iterdir()]
          images.append((root / 'preview.png', (2560, 1440)))
          for path, dimensions in images:
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', str(path)
              assert struct.unpack('>II', data[16:24]) == dimensions, str(path)
              offset = 8
              while offset < len(data):
                  size = int.from_bytes(data[offset:offset+4], 'big')
                  kind = data[offset+4:offset+8]
                  assert kind not in {b'tEXt', b'zTXt', b'iTXt', b'eXIf'}, f'Metadata in {path}'
                  offset += size + 12
              assert offset == len(data), f'Invalid PNG chunks: {path}'
          assert hashlib.sha256((root / 'preview.png').read_bytes()).digest() == hashlib.sha256(
              (root / 'screenshots/01-jade-prism.png').read_bytes()).digest()

          for path in root.rglob('*'):
              if '.git' in path.parts:
                  continue
              assert not path.is_symlink(), f'Symlink in package: {path}'
              assert path.suffix.lower() not in {'.py', '.sh', '.lua'}, f'Bundled executable: {path}'
          for path in root.rglob('*.md'):
              if '.git' in path.parts:
                  continue
              for target in re.findall(r'\]\(([^)]+)\)', path.read_text()):
                  if '://' not in target and not target.startswith('#'):
                      assert (path.parent / target.split('#')[0]).is_file(), f'Broken link: {path}: {target}'
          print(f'Validated v{version}: palette, 9 shell sections, 3 backgrounds, 4 previews and documentation.')

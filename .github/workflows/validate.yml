name: Validate theme
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version, palette, assets and documentation
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import re
          import struct
          import tomllib

          root = Path('.')
          version = (root / 'VERSION').read_text().strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Invalid VERSION'
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              assert os.environ.get('GITHUB_REF_NAME') == 'v' + version, 'Tag/VERSION mismatch'
          assert f'v{version}' in (root / 'README.md').read_text()
          assert f'## {version} ' in (root / 'CHANGELOG.md').read_text()

          palette = tomllib.loads((root / 'colors.toml').read_text())
          for key, value in palette.items():
              if key != 'mode':
                  assert re.fullmatch(r'#[0-9a-fA-F]{6}', value), key
          def luminance(value):
              rgb = [int(value[i:i+2], 16) / 255 for i in (1, 3, 5)]
              linear = [c / 12.92 if c <= .04045 else ((c + .055) / 1.055) ** 2.4 for c in rgb]
              return sum(c * w for c, w in zip(linear, (.2126, .7152, .0722)))
          roles = ['foreground', 'dark_foreground', 'accent', 'muted', 'red', 'yellow',
                   'orange', 'green', 'cyan', 'blue', 'magenta', 'bright_foreground']
          for role in roles:
              for surface in ['background', 'lighter_background', 'selection']:
                  low, high = sorted([luminance(palette[role]), luminance(palette[surface])])
                  assert (high + .05) / (low + .05) >= 4.5, f'Low contrast: {role}/{surface}'
          expected_sections = {'bar', 'controls', 'font', 'launcher', 'lock', 'menu',
                               'notifications', 'popups', 'tooltip'}
          sections = list(root.glob('shell.*.toml'))
          assert {p.name.split('.')[1] for p in sections} == expected_sections
          for path in sections:
              tomllib.loads(path.read_text())

          expected_backgrounds = {'01-jade-prism.png', '02-ember-coast.png', '03-phosphor-bloom.png'}
          assert {p.name for p in (root / 'backgrounds').iterdir()} == expected_backgrounds
          assert {p.name for p in (root / 'screenshots').iterdir()} == expected_backgrounds
          images = [(p, (3840, 2160)) for p in (root / 'backgrounds').iterdir()]
          images += [(p, (2560, 1440)) for p in (root / 'screenshots').iterdir()]
          images.append((root / 'preview.png', (2560, 1440)))
          for path, dimensions in images:
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', str(path)
              assert struct.unpack('>II', data[16:24]) == dimensions, str(path)
              offset = 8
              while offset < len(data):
                  size = int.from_bytes(data[offset:offset+4], 'big')
                  kind = data[offset+4:offset+8]
                  assert kind not in {b'tEXt', b'zTXt', b'iTXt', b'eXIf'}, f'Metadata in {path}'
                  offset += size + 12
              assert offset == len(data), f'Invalid PNG chunks: {path}'
          assert hashlib.sha256((root / 'preview.png').read_bytes()).digest() == hashlib.sha256(
              (root / 'screenshots/01-jade-prism.png').read_bytes()).digest()

          for path in root.rglob('*'):
              if '.git' in path.parts:
                  continue
              assert not path.is_symlink(), f'Symlink in package: {path}'
              assert path.suffix.lower() not in {'.py', '.sh', '.lua'}, f'Bundled executable: {path}'
          for path in root.rglob('*.md'):
              if '.git' in path.parts:
                  continue
              for target in re.findall(r'\]\(([^)]+)\)', path.read_text()):
                  if '://' not in target and not target.startswith('#'):
                      assert (path.parent / target.split('#')[0]).is_file(), f'Broken link: {path}: {target}'
          print(f'Validated v{version}: palette, 9 shell sections, 3 backgrounds, 4 previews and documentation.')
